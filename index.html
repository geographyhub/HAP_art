<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3A1C40">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HAP Art">
<title>Art · Years 7 to 11 · Harris Academy Peckham</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&family=Nunito+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--deep:#3A1C40;--main:#A8326B;--pale:#F8E7EF;--line:#EBCFDC;--gold:#F4B740;--ink:#1B2A3A;--ink2:#4A5563;--paper:#FBF7F8;--good:#2E7D32;--bad:#B3261E;--card:#fff;--mono:'JetBrains Mono',Consolas,Menlo,monospace}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Nunito Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;background:var(--paper);color:var(--ink);font-size:20px;line-height:1.45;padding-bottom:84px}
a{color:var(--main);font-weight:700}
code,pre{font-family:var(--mono);font-size:.9em}
code{background:var(--pale);border-radius:6px;padding:1px 6px}
pre{background:#0F2230;color:#E8F4F4;border-radius:12px;padding:12px 14px;overflow-x:auto;line-height:1.5;margin:8px 0;white-space:pre}
header{background:var(--deep);color:#fff;position:relative;overflow:hidden;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 26px),repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 1px,transparent 1px 26px)}
.chipart{position:absolute;right:-30px;top:50%;transform:translateY(-50%);width:300px;height:300px;opacity:.9;pointer-events:none}
@media(max-width:700px){.chipart{width:200px;height:200px;right:-60px;opacity:.45}}@media(max-width:560px){.chipart{display:none}}
body.inpaper nav.tabs{position:static}body.inpaper .timerbar{top:0}
.mast{max-width:1000px;margin:0 auto;padding:24px 20px 20px;display:flex;justify-content:space-between;gap:16px;align-items:flex-start;position:relative;z-index:1}
.eyebrow{font-family:'Archivo',Arial,sans-serif;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.75);font-size:15px}
h1{font-family:'Archivo','Arial Black',Arial,sans-serif;font-weight:900;font-size:clamp(36px,7vw,58px);line-height:1;margin:8px 0 6px}
h1 span{color:var(--gold)}
.sub{font-size:clamp(18px,2.6vw,22px);color:rgba(255,255,255,.88)}
.logo{background:#fff;border-radius:12px;padding:8px 12px;flex:none;margin-right:170px}.logo img{display:block;height:46px;width:auto}
@media(max-width:700px){.logo{margin-right:0}}
.years{max-width:1000px;margin:0 auto;padding:0 20px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;position:relative;z-index:1}
.years .lab{font-weight:800;font-size:18px;color:rgba(255,255,255,.8);margin-right:4px}
.years button{font-family:'Archivo',Arial,sans-serif;font-weight:900;font-size:20px;min-width:58px;padding:10px 16px;border-radius:14px;border:2px solid rgba(255,255,255,.35);background:transparent;color:#fff;cursor:pointer}
.years button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--deep)}
nav.tabs{background:#fff;border-bottom:2px solid var(--line);position:sticky;top:0;z-index:5}
nav.tabs .in{max-width:1000px;margin:0 auto;padding:10px 20px;display:flex;gap:8px;flex-wrap:wrap}
nav.tabs button{font-family:'Archivo',Arial,sans-serif;font-weight:800;font-size:18px;border:2px solid var(--line);background:#fff;color:var(--deep);border-radius:999px;padding:9px 16px;cursor:pointer}
nav.tabs button[aria-current="page"]{background:var(--main);border-color:var(--main);color:#fff}
@media(max-width:560px){nav.tabs .in{gap:6px;padding:8px 10px}nav.tabs button{font-size:16px;padding:7px 11px}.mast{flex-direction:column-reverse;padding:16px 16px 12px}.mast .logo img{height:38px}.years{padding:0 16px 14px;flex-wrap:nowrap;gap:8px}.years .lab{display:none}.years button{flex:1;min-width:0;padding:9px 4px}}
main{max-width:1000px;margin:0 auto;padding:22px 20px 40px}
h2{font-family:'Archivo',Arial,sans-serif;font-weight:900;font-size:clamp(28px,5vw,38px);color:var(--deep);margin:32px 0 12px;line-height:1.1}
main>h2:first-of-type,.tag+h2{margin-top:10px}
h3{font-family:'Archivo',Arial,sans-serif;font-weight:900;font-size:24px;color:var(--deep);margin:22px 0 8px}
.tag{display:inline-block;background:var(--main);color:#fff;font-weight:800;border-radius:999px;padding:6px 16px;font-size:16px;letter-spacing:.06em}
.lead{font-size:20px;margin-bottom:12px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:760px){.facts{grid-template-columns:1fr 1fr}}@media(max-width:480px){.facts{grid-template-columns:1fr}}
.fact{background:var(--pale);border-radius:18px;padding:16px 18px}
.fact b{display:block;font-family:'Archivo',Arial,sans-serif;font-weight:900;font-size:30px;color:var(--main);line-height:1.1;margin-bottom:4px}
.note{background:#FFF6DF;border-left:6px solid #E8A33D;border-radius:12px;padding:14px 18px;margin:16px 0;font-size:20px}
.blocks{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}@media(max-width:700px){.blocks{grid-template-columns:1fr}}
.blk{background:#fff;border:2px solid var(--line);border-radius:16px;padding:16px 18px}
.blk h3{margin:0 0 6px}.blk ul{padding-left:24px}.blk li{margin:5px 0}
ol.steps{list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding:14px 16px 14px 72px;background:#fff;border:2px solid var(--line);border-radius:16px;margin-bottom:10px}
ol.steps li::before{content:counter(s);position:absolute;left:14px;top:12px;width:44px;height:44px;border-radius:12px;background:var(--main);color:#fff;font:900 22px 'Archivo',Arial,sans-serif;display:flex;align-items:center;justify-content:center}
ol.steps.top li::before{background:#E8A33D}
.links li{margin:8px 0}.links{padding-left:24px}
.tblw{overflow-x:auto;margin:10px 0 16px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;font-size:19px}
th{background:var(--main);color:#fff;text-align:left;padding:11px 14px}td{padding:11px 14px;border-top:2px solid var(--line);vertical-align:top}
tr:nth-child(even) td{background:var(--paper)}
@media(max-width:560px){table.stk thead{display:none}table.stk,table.stk tbody,table.stk tr,table.stk td{display:block;width:100%}table.stk tr{border-top:3px solid var(--main);padding:6px 0}table.stk td{border-top:none;padding:5px 14px}table.stk td[data-label]::before{content:attr(data-label);display:block;font-size:15px;font-weight:800;color:var(--main)}}
.soon{margin-top:24px;background:#fff;border:2px dashed var(--line);border-radius:18px;padding:16px 20px;color:var(--ink2)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0 16px}
.tog{font:800 18px 'Nunito Sans',Arial,sans-serif;border:2px solid var(--main);background:#fff;color:var(--deep);border-radius:999px;padding:9px 18px;cursor:pointer}
.tog[aria-pressed="true"]{background:var(--main);color:#fff}
.topic{background:#fff;border:2px solid var(--line);border-radius:18px;margin-bottom:14px;overflow:hidden}
.topic summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:14px;padding:14px 18px;font:900 23px 'Archivo',Arial,sans-serif;color:var(--deep)}
.topic summary::-webkit-details-marker{display:none}
.topic summary .em{font-size:34px;line-height:1}
.topic summary .sub2{display:block;font:700 16px 'Nunito Sans',Arial,sans-serif;color:var(--ink2)}
.topic summary::after{content:'+';margin-left:auto;font-size:30px;color:var(--main)}
.topic[open] summary::after{content:'–'}
.learn{padding:0 20px 8px}.learn h4{font:900 20px 'Archivo',Arial,sans-serif;color:var(--main);margin:4px 0 6px}
.learn ul{padding-left:22px}.learn li{margin:7px 0}
.qa{width:100%;border-collapse:collapse}
.qa td{border-top:2px solid var(--line);padding:11px 16px;vertical-align:top}
.qa td.q{font-weight:800;color:var(--deep);width:46%}
.cover .qa td.a{color:transparent;background:repeating-linear-gradient(135deg,var(--pale) 0 8px,#fff 8px 16px)!important;cursor:pointer}
.cover .qa td.a.show{color:var(--ink);background:#fff!important}
.cover .qa td.a code{background:transparent}
.cover .qa td.a:not(.show) *{visibility:hidden}
@media(max-width:600px){.qa td{display:block;width:auto!important;border-top:none;padding:4px 16px}.qa tr{display:block;border-top:2px solid var(--line);padding:8px 0}}
.panel{background:#fff;border:2px solid var(--line);border-radius:18px;padding:18px 20px}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.btn{font-family:'Archivo',Arial,sans-serif;font-weight:800;border:none;border-radius:14px;background:var(--main);color:#fff;cursor:pointer;font-size:19px;padding:12px 18px}
.btn.alt{background:#fff;color:var(--deep);border:2px solid var(--main)}
.big{font:900 22px 'Archivo',Arial,sans-serif;border:none;border-radius:16px;background:var(--main);color:#fff;padding:16px 26px;cursor:pointer}
.big.alt{background:#fff;color:var(--deep);border:2px solid var(--main)}
.chipset{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.chipset button{font:800 17px 'Nunito Sans',Arial,sans-serif;border:2px solid var(--line);background:#fff;color:var(--deep);border-radius:999px;padding:8px 14px;cursor:pointer}
.chipset button[aria-pressed="true"]{background:var(--deep);border-color:var(--deep);color:#fff}
.decks{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 14px}
.decks button{font-family:'Archivo',Arial,sans-serif;font-weight:800;font-size:17px;border:2px solid var(--line);background:#fff;color:var(--deep);border-radius:14px;padding:10px 14px;cursor:pointer}
.decks button[aria-pressed="true"]{background:var(--pale);border-color:var(--main)}
.decks small{font-weight:700;opacity:.75}
/* Leitner flashcards: same boxes as the other Peckham Hub apps */
.fc{position:relative;height:300px;border:none;background:none;width:100%;padding:0;cursor:pointer}
.fc .face{position:absolute;inset:0;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;backface-visibility:hidden;transition:transform .5s;border:2px solid var(--line);text-align:center}
.fc .front{background:var(--deep);color:#fff}
.fc .front b{font-family:'Archivo',Arial,sans-serif;font-size:clamp(24px,4.4vw,34px);line-height:1.25}
.fc .back{background:var(--card);color:var(--deep);transform:rotateY(180deg);font-size:22px}
.fc.flip .front{transform:rotateY(180deg)} .fc.flip .back{transform:rotateY(360deg)}
.fc small{font-size:16px;opacity:.8;margin-top:12px}
@media (prefers-reduced-motion:reduce){.fc .face{transition:none}}
.lt{max-width:820px}
.lt-top{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.lt-stat{flex:1 1 150px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 16px}
.lt-stat b{display:block;font-family:'Fredoka','Trebuchet MS',Arial,sans-serif;font-size:34px;line-height:1.1;color:var(--ink)}
.lt-stat span{font-size:16px;color:var(--ink2);font-weight:700}
.lt-xp{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
.lt-xp i{display:block;height:100%;background:var(--main);border-radius:99px;transition:width .5s}
.lt-boxes{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:6px 0 18px;padding-top:8px}
.lt-box{position:relative;height:150px;color:#fff;text-align:center}
.lt-box.b1{--c:#B3261E;--top:#D9574F;--in:#5E120E}.lt-box.b2{--c:#C0631A;--top:#E38A45;--in:#663209}
.lt-box.b3{--c:#B08A00;--top:#D9B23A;--in:#5C4800}.lt-box.b4{--c:#1F7A9C;--top:#4FA6C6;--in:#0C3B4D}.lt-box.b5{--c:#2E7D32;--top:#5DAA61;--in:#123F15}
.lt-box .lid{position:absolute;left:0;right:0;top:0;height:34px;background:var(--top);clip-path:polygon(12% 0,88% 0,100% 100%,0 100%)}
.lt-box .lid::after{content:'';position:absolute;left:9%;right:9%;top:5px;bottom:4px;background:var(--in);clip-path:polygon(10% 0,90% 0,100% 100%,0 100%)}
.lt-box .stack{position:absolute;left:0;right:0;top:-6px;height:40px;z-index:1;pointer-events:none}
.lt-box .stack i{position:absolute;left:50%;bottom:0;width:48%;height:36px;margin-left:-24%;background:#fff;border-radius:3px;box-shadow:0 1px 3px rgba(0,0,0,.35);border-top:4px solid var(--top)}
.lt-box .stack i:nth-child(1){transform:translateX(-14%) rotate(-9deg)}.lt-box .stack i:nth-child(2){transform:translateX(12%) rotate(7deg)}.lt-box .stack i:nth-child(3){transform:translateY(-6px)}
.lt-box .front{position:absolute;left:0;right:0;top:32px;bottom:0;z-index:2;border-radius:3px 3px 14px 14px;padding:10px 4px 8px;display:flex;flex-direction:column;justify-content:flex-end;
 background:linear-gradient(90deg,rgba(0,0,0,.22),rgba(0,0,0,0) 14%,rgba(255,255,255,.08) 50%,rgba(0,0,0,0) 86%,rgba(0,0,0,.25)),var(--c);
 box-shadow:inset 0 3px 0 rgba(255,255,255,.25),inset 0 -10px 0 rgba(0,0,0,.2),0 8px 0 -2px rgba(0,0,0,.18),0 12px 16px rgba(0,0,0,.22)}
.lt-box .n{font-family:'Fredoka','Trebuchet MS',Arial,sans-serif;font-size:38px;line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.lt-box .l{font-family:'Fredoka','Trebuchet MS',Arial,sans-serif;font-size:19px;margin-top:4px}
.lt-box .w{font-size:14px;font-weight:700;opacity:.95;margin-top:2px;line-height:1.2}
.lt-box.pulse{animation:ltpulse .6s}
@keyframes ltpulse{40%{transform:translateY(-6px) scale(1.06)}}
.lt-burst{position:absolute;left:50%;top:14px;width:0;height:0;z-index:5;pointer-events:none}
.lt-burst i{position:absolute;width:9px;height:14px;border-radius:2px;opacity:0;animation:ltconf 1s cubic-bezier(.2,.7,.4,1) forwards}
.lt-burst i.r{width:10px;height:10px;border-radius:50%}
@keyframes ltconf{0%{opacity:1;transform:translate(0,0) rotate(0)}65%{opacity:1;transform:translate(var(--x),var(--y)) rotate(var(--r))}100%{opacity:0;transform:translate(calc(var(--x)*1.15),calc(var(--y) + 46px)) rotate(calc(var(--r)*1.6))}}
@media(max-width:560px){.lt-boxes{gap:6px}.lt-box{height:136px}.lt-box .lid{height:28px}.lt-box .front{top:26px;border-radius:3px 3px 10px 10px;padding:8px 2px 7px}.lt-box .n{font-size:30px}.lt-box .l{font-size:16px}.lt-box .w{font-size:12px}.lt-box .stack i{height:28px}}
@media (prefers-reduced-motion:reduce){.lt-box.pulse,.lt-burst i{animation:none}}
.lt-big{font-size:21px;padding:14px 22px}
.lt-msg{font-size:20px;margin:6px 0 14px}
.lt-run .qhead,.run .qhead{display:flex;justify-content:space-between;font-weight:800;font-size:18px;color:var(--ink2);margin-bottom:6px}
.lt-run .bar,.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:14px}
.lt-run .bar i,.bar i{display:block;height:100%;background:var(--main);transition:width .3s}
.lt-tag{display:inline-block;font-weight:800;font-size:15px;color:#fff;border-radius:99px;padding:4px 12px;margin-bottom:8px}
.lt-run .fc{height:320px}
.lt-run .fc .back{font-size:22px;line-height:1.35}
.lt-ans{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.lt-ans button{border:none;border-radius:16px;padding:18px 10px;font-family:'Fredoka','Trebuchet MS',Arial,sans-serif;font-size:24px;color:#fff;cursor:pointer}
.lt-ans .no{background:var(--bad)}.lt-ans .yes{background:var(--good)}
.lt-ans button:disabled{opacity:.35;cursor:default}
.lt-hint{font-size:18px;color:var(--ink2);text-align:center;margin-top:10px;min-height:26px;font-weight:700}
.lt-pop{font-family:'Fredoka','Trebuchet MS',Arial,sans-serif;font-size:22px;text-align:center;margin-top:10px;min-height:30px}
.lt-pop.up{color:var(--good)}.lt-pop.down{color:var(--bad)}
.lt-end .score{font-size:64px;font-family:'Archivo',Arial,sans-serif;font-weight:900;color:var(--main)}
.lt-list{display:grid;gap:8px;margin-top:12px}
.lt-list div{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 14px;font-size:18px}
.lt-how{margin-top:18px}.lt-how summary{cursor:pointer;font-weight:800;font-size:19px}.lt-how p{font-size:18px;margin-top:8px}
body.running .phub{display:none}
/* picture glossary */
.pgsearch{width:100%;padding:14px 16px;border:2px solid var(--line);border-radius:12px;font-size:19px;margin:6px 0 12px}
.pgsets{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.pgsets button{font-weight:800;font-size:17px;border:2px solid var(--line);background:#fff;color:var(--deep);border-radius:999px;padding:8px 16px;cursor:pointer}
.pgsets button[aria-pressed="true"]{background:var(--deep);color:#fff;border-color:var(--deep)}
.pgl h3{margin:20px 0 10px;font-size:23px}
.pgx{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:12px}
.pgx>div{display:grid;grid-template-columns:128px 1fr;gap:18px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:18px;line-height:1.4;color:#102A43}
.hi-i{display:block;width:128px;height:128px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:6px}
.hi-i svg{width:100%;height:100%;display:block}
.pgx .pgw{display:block;font-size:22px;margin-bottom:4px;font-family:'Archivo',Arial,sans-serif;font-weight:900}
.pgx .pge{display:block;color:var(--ink2);font-size:18px}
@media (max-width:480px){.pgx>div{grid-template-columns:96px 1fr;gap:12px}.hi-i{width:96px;height:96px}}
/* quiz */
.qcard{background:#fff;border-radius:18px;padding:18px;border:2px solid var(--line)}
.qq{font:800 23px 'Nunito Sans',Arial,sans-serif;margin-bottom:14px}
.qopts{display:grid;gap:10px}
.qopts button,.opts button{text-align:left;font:700 20px 'Nunito Sans',Arial,sans-serif;background:#fff;border:2px solid var(--line);border-radius:14px;padding:13px 16px;cursor:pointer;color:var(--ink)}
.qopts button b,.opts button b{display:inline-block;width:34px;color:var(--main)}
.qopts button.right,.opts button.right{background:#E3F2E4;border-color:var(--good)}.qopts button.wrong,.opts button.wrong{background:#FBE4E2;border-color:var(--bad)}
.opts{display:grid;gap:8px}.opts button[aria-pressed="true"]{border-color:var(--deep);background:var(--pale)}
.qfb{margin-top:14px;font-size:20px}.qfb strong{display:block;font-size:22px}
.endscore{font:900 60px 'Archivo',Arial,sans-serif;color:var(--main)}
/* papers */
.pcards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}@media(max-width:700px){.pcards{grid-template-columns:1fr}}
.pcard{background:#fff;border:2px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:6px;text-align:left;cursor:pointer;font:inherit;color:inherit}
.pcard:hover{border-color:var(--main)}
.pcard .k{font:900 15px 'Archivo',Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--main)}
.pcard .h{font:900 24px 'Archivo',Arial,sans-serif;color:var(--deep);line-height:1.15}
.pcard .d{font-size:18px;color:var(--ink2)}
.pcard .s{font-weight:800;font-size:17px;color:var(--good)}
.timerbar{position:sticky;top:0;z-index:4;background:var(--deep);color:#fff;border-radius:14px;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:8px 0 16px;box-shadow:0 6px 16px rgba(0,0,0,.2)}
.timerbar .clock{font:900 26px var(--mono);min-width:110px}
.timerbar .clock.low{color:#FFB4AB}
.timerbar .grow{flex:1}
.timerbar .btn{padding:9px 14px;font-size:17px;background:var(--gold);color:var(--deep)}
.sect{font:900 26px 'Archivo',Arial,sans-serif;color:#fff;background:var(--main);border-radius:14px;padding:10px 16px;margin:26px 0 10px}
.sect small{display:block;font:700 17px 'Nunito Sans',Arial,sans-serif;opacity:.9}
.qgroup{background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:16px}
.qgroup .stem{font-weight:700;color:var(--deep);background:var(--pale);border-radius:12px;padding:10px 14px;margin-bottom:6px}
.part{padding:14px 0;border-top:2px dashed var(--line)}.part:first-child{border-top:none}
.part .ph{display:flex;gap:12px;align-items:flex-start}
.part .pn{font:900 20px 'Archivo',Arial,sans-serif;color:var(--main);min-width:58px}
.part .pq{flex:1}.part .pq ul{padding-left:22px;margin:6px 0}
.mk{font:900 16px 'Archivo',Arial,sans-serif;background:var(--deep);color:#fff;border-radius:8px;padding:3px 9px;white-space:nowrap}
.part textarea{width:100%;font:inherit;font-size:19px;border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px;resize:vertical;background:#FCFEFE}
.part textarea.code{font-family:var(--mono);font-size:17px;background:#0F2230;color:#E8F4F4;border-color:#0F2230;tab-size:4}
.part input.sh{font:inherit;font-size:20px;border:2px solid var(--line);border-radius:12px;padding:9px 12px;margin-top:10px;width:min(100%,360px);font-family:var(--mono)}
.ttab{margin-top:10px}
.ttab table{font-size:18px}.ttab td,.ttab th{padding:8px 10px;text-align:center}
.ttab td.l{text-align:left;font-weight:700}
.ttab input[type=radio],.ttab input[type=checkbox]{width:26px;height:26px;accent-color:var(--main);cursor:pointer}
.ttab input.cell,.ttab select{font:inherit;font-size:18px;border:2px solid var(--line);border-radius:10px;padding:6px 8px;width:100%;min-width:70px;font-family:var(--mono)}
.ttab td.ok{background:#E3F2E4!important}.ttab td.no{background:#FBE4E2!important}
.ms{display:none;margin-top:12px;background:#EEF8EF;border:2px solid #A5D6A7;border-radius:14px;padding:12px 16px;font-size:18px}
.ms.show{display:block}.ms b.h{display:block;font:900 18px 'Archivo',Arial,sans-serif;color:var(--good);margin-bottom:4px}
.ms ul{padding-left:22px}.ms table{font-size:16px;margin:6px 0}.ms th{background:var(--good)}
.selfmark{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;font-weight:800}
.selfmark button{min-width:44px;height:44px;border-radius:10px;border:2px solid var(--line);background:#fff;font:900 18px 'Archivo',Arial,sans-serif;cursor:pointer;color:var(--deep)}
.selfmark button[aria-pressed="true"]{background:var(--main);border-color:var(--main);color:#fff}
.autores{margin-top:10px;font-weight:900;font-size:19px}.autores.ok{color:var(--good)}.autores.no{color:var(--bad)}
.scorebox{background:var(--deep);color:#fff;border-radius:18px;padding:18px 20px;margin:10px 0 18px}
.scorebox b{font:900 46px 'Archivo',Arial,sans-serif;color:var(--gold)}
.wt{background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:14px}
.wt h3{margin:0 0 8px}
.wt .lab{font:900 15px 'Archivo',Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;margin-top:10px;display:block}
.wt .eg{background:var(--pale);border-radius:12px;padding:10px 14px;font-weight:700;color:var(--deep)}
.wt .lab.a{color:var(--main)}.wt .lab.b{color:var(--good)}.wt .lab.c{color:var(--bad)}
.wt .model{background:#EEF8EF;border-radius:12px;padding:10px 14px}
.wt .warn{background:#FDECEA;border-radius:12px;padding:10px 14px}
.back{display:block;margin-bottom:10px;font-weight:800;cursor:pointer;background:none;border:none;color:var(--main);font-size:19px;padding:6px 0}
.ch{background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.ch h3{margin:0 0 6px;font-size:21px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lv{font:900 13px 'Archivo',Arial,sans-serif;color:#fff;border-radius:8px;padding:3px 8px}
.ch .done{margin-left:auto;font-size:16px;font-weight:800;color:var(--good)}
.chk li{list-style:none;margin:8px 0}.chk label{display:flex;gap:12px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer}
.chk input{width:26px;height:26px;accent-color:var(--good)}
.cheat td{font-size:16px}.cheat td pre{margin:0;font-size:14px}
.vidcard{background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px 18px;margin:6px 0 20px}
.vidcard h3{margin:0 0 4px}.vidcard p{margin-bottom:12px}
.vplayer{position:relative;container-type:inline-size;border-radius:12px;overflow:hidden;background:#1A2939}
.vplayer video{display:block;width:100%;aspect-ratio:16/9;background:#1A2939}
.vsub{position:absolute;left:0;right:0;bottom:0;min-height:15.8%;display:flex;align-items:center;justify-content:center;padding:.4em 4%;background:#1A2939;color:#fff;font-weight:700;text-align:center;line-height:1.25;font-size:clamp(15px,2.2cqw,44px);pointer-events:none}
.vsub:empty{background:transparent}
.vplayer:fullscreen{display:flex;flex-direction:column;justify-content:center;border-radius:0}.vplayer:fullscreen video{height:auto;max-height:100vh}
.vplayer:-webkit-full-screen{display:flex;flex-direction:column;justify-content:center}
.langbar{display:grid;gap:12px;margin-top:16px}.langrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.langrow .lab{font-size:20px;font-weight:800;min-width:118px}
.lbtn{border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:10px 20px;font-size:20px;font-weight:800;cursor:pointer}
.lbtn[aria-pressed="true"]{background:#1A2939;color:#fff;border-color:#1A2939}
.fsbtn{margin-top:12px;border:2px solid var(--main);background:#fff;color:var(--deep);border-radius:12px;padding:9px 16px;font:800 18px 'Archivo',Arial,sans-serif;cursor:pointer}
.vtip{font-size:17px;color:var(--ink2);margin-top:10px}
@media(max-width:600px){.vsub{position:static;min-height:4.4em;font-size:17px;padding:.5em 5%}.langrow .lab{flex-basis:100%;min-width:0}.lbtn{padding:9px 16px;font-size:19px}}
.phub{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:20;background:#102A43;color:#F4B740;font:800 18px/1 'Archivo',Arial,sans-serif;padding:13px 18px;border-radius:999px;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.35);border:2px solid #F4B740}
footer{max-width:1000px;margin:0 auto;padding:0 20px 30px;font-size:16px;color:var(--ink2)}
@media print{nav.tabs,.years,.phub,.timerbar{display:none!important}body{background:#fff}}
.bigic{flex:none;background:#fff;border:2px solid var(--line);border-radius:14px;padding:4px}
.topic.artist summary{align-items:flex-start}
.topic.artist summary .one{display:block;font:600 18px 'Nunito Sans',Arial,sans-serif;color:var(--ink);margin-top:4px}
.idea{font-size:20px;font-weight:700;color:var(--deep);background:var(--pale);border-radius:12px;padding:10px 14px}
.kw{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}.kw span{background:var(--pale);border:2px solid var(--line);border-radius:999px;padding:5px 13px;font-weight:800;font-size:17px;color:var(--deep)}
.kwbig span{font-size:19px;padding:8px 16px}
.model{background:#EEF8EF;border-left:6px solid var(--good);border-radius:12px;padding:12px 16px;font-size:19px}
.learn ol.steps{margin-top:6px}
.ask{background:#fff;border:3px solid var(--main);border-radius:18px;padding:14px 18px;margin:8px 0 18px;font-size:20px}.ask ol{padding-left:26px;margin-top:6px}.ask li{margin:4px 0}
.amini{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}@media(max-width:700px){.amini{grid-template-columns:1fr}}
.amini a{display:flex;gap:14px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px;text-decoration:none;color:var(--ink);font-weight:600;font-size:18px}
.amini a b{display:block;font:900 21px 'Archivo',Arial,sans-serif;color:var(--deep)}
.fgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}@media(max-width:760px){.fgrid{grid-template-columns:1fr}}
.fel{display:flex;gap:16px;background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px 16px;align-items:flex-start}
.fel h3{margin:0 0 4px}.fel p{font-size:19px}.fel .try{margin-top:4px;font-size:18px}
@media(max-width:480px){.fel{flex-direction:column}}
.wsec{background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:14px}.wsec h3{margin:0 0 8px}
.starters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.starters button{font:700 18px 'Nunito Sans',Arial,sans-serif;background:var(--pale);border:2px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer;color:var(--deep);text-align:left}
.wsec textarea,.plan textarea,.plan input{width:100%;font:inherit;font-size:20px;border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:#FFFDFE}
.aot{font:900 15px 'Archivo',Arial,sans-serif;background:var(--deep);color:#fff;border-radius:8px;padding:3px 9px;vertical-align:middle}
.wmsg{font-weight:800;color:var(--good);align-self:center}
.aocard{background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:16px}
.aocard h4{font:900 20px 'Archivo',Arial,sans-serif;color:var(--main);margin:12px 0 4px}.aocard ul{padding-left:24px}.aocard li{margin:5px 0}
.aoh{display:flex;align-items:center;gap:12px}.aoh h3{margin:0}
.aon{font:900 22px 'Archivo',Arial,sans-serif;background:var(--main);color:#fff;border-radius:12px;padding:6px 12px}.aoe{font-size:30px}
.topb{background:#FFF6DF;border-radius:12px;padding:10px 14px;font-weight:700}
.plan label{display:block;margin-bottom:12px}.plan label b{display:block;margin-bottom:4px}
.plan .hr{display:grid;grid-template-columns:90px 1fr;gap:10px;align-items:center}.plan .hr b{margin:0}

</style>
</head>

window.APPDATA={"years": {"7": {"ks": 3, "stage": "Key Stage 3 · Practical assessment in January"}, "8": {"ks": 3, "stage": "Key Stage 3 · Practical assessment in January"}, "9": {"ks": 3, "stage": "Key Stage 3 · Practical assessment in January"}, "10": {"ks": 4, "stage": "GCSE Art, Craft and Design · Eduqas · Project: Fragments"}, "11": {"ks": 4, "stage": "GCSE Art, Craft and Design · Eduqas · Portfolio and ESA"}}, "artists": {"pecis": {"name": "Hilary Pecis", "life": "Born 1979", "from": "American, lives in Los Angeles", "icon": "stilllife", "one": "Bright, busy paintings of everyday rooms, tables, shelves and streets.", "what": ["She paints <b>still lifes<\/b> and <b>interiors<\/b>: tables, bookshelves, plants, flowers and the objects in people's homes. She also paints streets and landscapes.", "She starts from <b>photos she takes on her phone<\/b>, then builds the painting up from them.", "She paints with <b>acrylic<\/b> paint."], "look": ["<b>Colour<\/b>: bright, saturated colours placed side by side.", "<b>Pattern<\/b>: rugs, book spines, tiles and leaves all become pattern.", "<b>Shape<\/b>: flat shapes with clear edges and little shading.", "<b>Perspective<\/b>: she flattens space, so the table top can tip up towards you.", "<b>Line<\/b>: crisp outlines around objects."], "idea": "She shows that ordinary objects at home can be beautiful and worth looking at closely.", "words": ["still life", "interior", "saturated colour", "pattern", "flat", "perspective", "acrylic"], "try": ["Photograph a table or shelf at home with lots of objects on it.", "Draw it with clear outlines, then fill each shape with a flat, bright colour.", "Add pattern to books, fabric and plants."], "model": "Hilary Pecis paints everyday interiors using bright, saturated acrylic colour. Every object is a flat shape with a clear outline, and patterns on books and rugs fill the composition. I like how she makes ordinary things look exciting. I will use her flat colour and pattern in my own still life.", "links": [["Hilary Pecis on Ocula (artworks and biography)", "https://ocula.com/artists/hilary-pecis/"], ["Hilary Pecis on Wikipedia", "https://en.wikipedia.org/wiki/Hilary_Pecis"]]}, "warhol": {"name": "Andy Warhol", "life": "1928–1987", "from": "American", "icon": "popart", "one": "The best-known Pop artist: bright, repeated prints of famous faces and everyday products.", "what": ["He was a leader of <b>Pop Art<\/b> in the 1960s: art about popular culture, adverts, celebrities and things people buy.", "He made <b>screen prints<\/b> (silkscreen), which let him print the same image again and again.", "Famous works: soup cans, Coca-Cola bottles and portraits of stars such as Marilyn Monroe."], "look": ["<b>Repetition<\/b>: the same image repeated in a grid.", "<b>Colour<\/b>: bold, bright, unnatural colours that change from one print to the next.", "<b>Shape<\/b>: flat areas of colour with little shading.", "<b>Contrast<\/b>: strong darks against bright colour."], "idea": "He made art that looked like mass-produced adverts, to show how fame and shopping filled modern life.", "words": ["Pop Art", "screen print", "repetition", "mass production", "celebrity", "bold colour"], "try": ["Take a photo of a face or an everyday object.", "Simplify it into a few flat shapes of light and dark.", "Repeat it four times and use a different colour scheme in each."], "model": "Andy Warhol was a Pop artist who used screen printing to repeat the same image many times. He used bold, unnatural colours and flat shapes. The repetition makes the image look like an advert. In my work I will repeat my design and change the colour scheme each time.", "links": [["Who is Andy Warhol? (Tate Kids)", "https://www.tate.org.uk/kids/explore/who-is/who-andy-warhol"], ["Andy Warhol in the Tate collection", "https://www.tate.org.uk/art/artists/andy-warhol-2121"], ["Make Pop Art like Warhol (Tate Kids)", "https://www.tate.org.uk/kids/make/paint-draw/make-pop-art-warhol"]]}, "vangogh": {"name": "Vincent van Gogh", "life": "1853–1890", "from": "Dutch", "icon": "brushmarks", "one": "Thick paint, swirling brushstrokes and bold colour, in sunflowers, starry skies and self-portraits.", "what": ["He was a <b>Post-Impressionist<\/b> painter. He painted landscapes, flowers, people and many <b>self-portraits<\/b>.", "Famous works: <i>Sunflowers<\/i> (1888) and <i>The Starry Night<\/i> (1889). One version of <i>Sunflowers<\/i> is at the National Gallery in London.", "He sold very little in his lifetime but is now one of the most famous artists ever."], "look": ["<b>Mark making<\/b>: short, visible brushstrokes that follow the shape of things.", "<b>Texture<\/b>: thick paint (called <b>impasto<\/b>) that stands up from the canvas.", "<b>Colour<\/b>: strong colours, often <b>complementary<\/b> pairs such as blue and orange, or yellow and purple.", "<b>Movement<\/b>: swirling lines make skies and fields look alive."], "idea": "He used colour and brushstrokes to show feelings, not just what things looked like.", "words": ["Post-Impressionism", "impasto", "brushstroke", "texture", "complementary colours", "expressive"], "try": ["Draw a simple flower, tree or sky.", "Fill it with short, directional marks instead of flat colour.", "Use oil pastels or thick paint and put complementary colours next to each other."], "model": "Van Gogh used short, thick brushstrokes called impasto, which give his paintings texture and movement. He used complementary colours such as blue and orange to make them stand out. His work feels energetic and emotional. I will use directional marks with oil pastel in my own piece.", "links": [["5 things to know about Van Gogh's Sunflowers (Van Gogh Museum)", "https://www.vangoghmuseum.nl/en/art-and-stories/stories/5-things-you-need-to-know-about-van-goghs-sunflowers"], ["Sunflowers on Google Arts and Culture", "https://artsandculture.google.com/asset/sunflowers/hwEGmsM-FoHAwA"]]}, "picasso": {"name": "Pablo Picasso", "life": "1881–1973", "from": "Spanish, lived mostly in France", "icon": "cubism", "one": "Co-inventor of Cubism: faces and objects broken into shapes and seen from several sides at once.", "what": ["He was a painter, sculptor and printmaker who kept changing his style: the <b>Blue Period<\/b>, then <b>Cubism<\/b>, which he created with Georges Braque.", "In Cubism, an object is broken into <b>geometric shapes<\/b> and shown from <b>several viewpoints at the same time<\/b>.", "Famous works: <i>Weeping Woman<\/i> (1937, at Tate Modern) and <i>Guernica<\/i> (1937)."], "look": ["<b>Shape<\/b>: faces made of angular, geometric pieces.", "<b>Viewpoint<\/b>: a face shown from the front and the side at once.", "<b>Line<\/b>: thick, strong outlines.", "<b>Colour<\/b>: sometimes one mood colour (blue), sometimes bright and clashing."], "idea": "He showed that art does not have to copy what we see: it can show how we think and feel about something.", "words": ["Cubism", "Blue Period", "geometric", "fragmented", "multiple viewpoints", "abstract", "collage"], "try": ["Draw a face from the front and from the side.", "Cut both up and collage them together into one face.", "Outline each shape boldly and colour the pieces in contrasting colours."], "model": "Picasso created Cubism, where faces are broken into geometric shapes and shown from more than one viewpoint at once. In Weeping Woman he uses sharp shapes and clashing colours to show sadness. I will combine a front and side view in my own portrait.", "links": [["Who is Pablo Picasso? (Tate Kids)", "https://www.tate.org.uk/kids/explore/who-is/who-pablo-picasso"], ["What is Cubism? (Tate Kids)", "https://www.tate.org.uk/kids/types-of-art/cubism"], ["Pablo Picasso in the Tate collection", "https://www.tate.org.uk/art/artists/pablo-picasso-1767"]]}, "parr": {"name": "Mike Parr", "life": "Born 1945", "from": "Australian", "icon": "etching", "one": "A performance artist whose huge, scratched self-portrait etchings look scrubbed, damaged and haunted.", "what": ["He is known for <b>performance art<\/b>, but he has also made a <b>Self Portrait Project<\/b> of more than a thousand works.", "Many are large <b>drypoint etchings<\/b>: lines are scratched straight into a metal plate, which is inked and printed. He worked with the printer John Loane.", "He draws his own face again and again, then scribbles over it, scrubs it out and lets the process damage it."], "look": ["<b>Mark making<\/b>: heavy, scratched, repeated lines.", "<b>Tone<\/b>: deep blacks built up from layers of lines.", "<b>Distortion<\/b>: the face is blurred, smudged or half lost.", "<b>Scale<\/b>: some prints are over a metre tall."], "idea": "The self-portrait is never finished or fixed: identity is unstable, and the marks show the struggle to see yourself.", "words": ["drypoint", "etching", "printmaking", "mark making", "self-portrait", "distortion", "performance art"], "try": ["Draw your self-portrait from a mirror in pen or charcoal.", "Work back into it: scribble, rub out, redraw and layer.", "Try drypoint on card or acetate and print it."], "model": "Mike Parr makes large drypoint self-portraits by scratching lines into metal plates. The marks are heavy and repeated, and the face is often scrubbed out or distorted, which suggests that identity is unstable. I will layer and rub out my own self-portrait marks in charcoal before trying drypoint.", "links": [["Mike Parr prints at the National Gallery of Australia", "https://nga.gov.au/exhibitions/drypoint-braille-and-excavation-mike-parr-prints"], ["A Mike Parr self-portrait at the Met Museum", "https://www.metmuseum.org/art/collection/search/486063"]]}, "bacon": {"name": "Francis Bacon", "life": "1909–1992", "from": "Irish-born British", "icon": "smear", "one": "Raw, twisted portraits where faces seem to smear, melt and scream.", "what": ["He was a <b>figurative<\/b> painter known for distorted heads, portraits and figures.", "He often worked from <b>photographs<\/b>, not from people sitting for him. He never went to art school.", "His \"screaming popes\" are based on photos of a 1650 portrait by the Spanish painter Velázquez.", "He often painted <b>triptychs<\/b>: three panels side by side."], "look": ["<b>Distortion<\/b>: faces twisted and smeared with a dry brush or rag.", "<b>Background<\/b>: flat, bold colour, often with lines like a cage or box around the figure.", "<b>Contrast<\/b>: soft, blurred flesh against sharp, flat space.", "<b>Mood<\/b>: tense, uneasy and dramatic."], "idea": "He wanted to show the feeling of a person, their energy and fear, rather than a polite likeness.", "words": ["figurative", "distortion", "smeared", "triptych", "expressive", "unsettling"], "try": ["Take a photo of a face, then drag it on a scanner or phone camera to blur it.", "Paint the face, then drag a dry brush or card through the wet paint.", "Put the head against a flat, bright background with a few linear \"cage\" lines."], "model": "Francis Bacon painted distorted portraits where the face appears smeared and twisted. He placed the figure against a flat, bold background, sometimes inside a cage of lines, which creates a tense mood. I will drag wet paint across my portrait to show emotion rather than a perfect likeness.", "links": [["Francis Bacon in the Tate collection", "https://tate.org.uk/art/artists/francis-bacon-682"], ["Who is Francis Bacon? (Tate)", "https://www.tate.org.uk/art/artists/francis-bacon-682/who-is-francis-bacon"]]}, "harris": {"name": "Henrietta Harris", "life": "Born 1984", "from": "New Zealand", "icon": "swipe", "one": "Beautiful, realistic portraits that she deliberately spoils with swirls, smudges and swipes of paint.", "what": ["She is a painter and illustrator from Auckland.", "She paints very <b>realistic<\/b> portraits in <b>watercolour and gouache<\/b>, and in oil.", "Then she <b>distorts<\/b> them: a swirl over the eyes, a smudge, or one sweep of a palette knife that wipes part of the face away (her <i>Fixed It<\/i> series)."], "look": ["<b>Contrast<\/b>: careful, realistic detail against one sudden, loose mark.", "<b>Colour<\/b>: soft, muted colours.", "<b>Tone<\/b>: gentle, smooth shading on the skin.", "<b>Focal point<\/b>: the distortion pulls your eye straight to it."], "idea": "The hidden or wiped face makes us ask who the person is and how much a face really tells us about identity.", "words": ["realism", "watercolour", "gouache", "distortion", "obscured", "palette knife", "muted"], "try": ["Draw or paint a careful, realistic portrait.", "Photocopy it, then distort the copy: swirl, smudge or swipe across it.", "Compare the two and annotate which says more about the person."], "model": "Henrietta Harris paints realistic portraits in watercolour and gouache and then distorts them with swirls or a single swipe of paint. The contrast between careful detail and the sudden mark creates a focal point. It makes me question identity. I will try a realistic study and then distort a copy.", "links": [["Henrietta Harris at Melanie Roger Gallery", "https://melanierogergallery.com/stockroom/henrietta-harris/"], ["Henrietta Harris at Robert Fontaine Gallery", "https://www.robertfontainegallery.com/artists/183-henrietta-harris/biography/"]]}, "rewa": {"name": "REWA", "life": "Born 1987", "from": "Nigerian, raised between Nigeria and England", "icon": "segments", "one": "Proud, colourful portraits where the face is split into patterned segments, celebrating Igbo heritage.", "what": ["She is a <b>self-taught<\/b> artist. She studied physiology and pharmacology at UCL in London, then worked in finance before becoming an artist.", "She paints in <b>acrylic and ink<\/b>.", "Her portraits celebrate <b>Igbo<\/b> culture in Nigeria: its history, values, gods and people. She calls her work \"Igbo Vernacular Art\"."], "look": ["<b>Shape<\/b>: the face is divided into segments, like stained glass, a mosaic or a map.", "<b>Colour<\/b>: bright, bold colour fills each segment.", "<b>Pattern<\/b>: hair, jewellery, clothing and pattern carry meaning.", "<b>Gaze<\/b>: the sitters look out with confidence."], "idea": "Identity is made of many layers: heritage, family, memory and pride. The segments show that a person is never just one thing.", "words": ["heritage", "identity", "segments", "pattern", "adornment", "acrylic and ink", "self-taught"], "try": ["Draw a portrait, then divide the face into segments with bold lines.", "Fill each segment with a colour or pattern that means something to your own heritage or story.", "Annotate what each colour and pattern represents."], "model": "REWA paints portraits in acrylic and ink, where the face is divided into bright, patterned segments like stained glass. The patterns and adornment celebrate Igbo heritage and show that identity has many layers. I will divide my own portrait into segments that each represent part of my identity.", "links": [["REWA biography at OOA Gallery", "https://ooagallery.com/artists/56-rewa/biography"], ["How REWA's art celebrates the Igbo people (Artwork Archive)", "https://www.artworkarchive.com/blog/how-rewa-s-art-amplifies-and-celebrates-the-igbo-people-of-nigeria"]]}, "sosnowska": {"name": "Monika Sosnowska", "life": "Born 1972", "from": "Polish, lives in Warsaw", "icon": "rebar", "one": "A sculptor who bends, twists and crushes steel, concrete and building parts until hard architecture looks soft.", "what": ["She makes very large <b>sculptures<\/b> and <b>site-specific installations<\/b>.", "She uses <b>construction materials<\/b>: steel beams, rebar (the ribbed steel rods inside concrete), pipes, concrete and handrails.", "Her work comes from the buildings of <b>communist Poland<\/b> and how they changed after communism ended. She takes fragments such as stairs, gates and handrails and transforms them.", "She starts with small <b>maquettes<\/b> (models) in wire, cardboard and paper.", "Her exhibition <i>Weight of Matter<\/i> was at the <b>South London Gallery on Peckham Road<\/b> from September to November 2026."], "look": ["<b>Form<\/b>: twisted, bent and crumpled 3D forms.", "<b>Texture<\/b>: rough concrete, ribbed steel, peeling paint.", "<b>Contrast<\/b>: heavy, rigid materials that look soft, like fabric or paper.", "<b>Fragment<\/b>: parts of buildings taken out of their setting."], "idea": "Buildings are not permanent: they carry history and politics, and they can break, decay and change like the society around them.", "words": ["sculpture", "installation", "site-specific", "rebar", "concrete", "maquette", "architecture", "post-communist"], "try": ["Photograph fragments of buildings near you: railings, stairs, broken concrete, scaffolding.", "Make a small maquette from wire, card and paper that bends or crushes one of those forms.", "Draw your maquette from three angles and annotate the textures."], "model": "Monika Sosnowska transforms construction materials such as steel and concrete into twisted, crushed forms. Rigid materials look soft, which makes architecture seem fragile. Her fragments of stairs and handrails link to the history of communist Poland. I will build a wire and card maquette that bends a railing I photographed in Peckham.", "links": [["Weight of Matter at the South London Gallery", "https://www.southlondongallery.org/exhibitions/monika-sosnowska-weight-of-matter/"], ["Monika Sosnowska on Ocula", "https://ocula.com/artists/monika-sosnowska/"]]}}, "ks3a": ["pecis", "warhol", "vangogh", "picasso"], "y10a": ["sosnowska"], "y11a": ["parr", "bacon", "harris", "rewa"], "formal": [{"k": "line", "t": "Line", "def": "A mark that joins two points. Lines can show edges, direction, movement and feeling.", "words": ["thick", "thin", "curved", "straight", "broken", "continuous", "hatching", "contour"], "try": "Draw one object four times using a different kind of line each time."}, {"k": "tone", "t": "Tone", "def": "How light or dark something is. Tone makes flat shapes look 3D.", "words": ["light", "mid-tone", "dark", "highlight", "shadow", "gradual", "blending", "contrast"], "try": "Make a tonal scale with five boxes from white to black, then shade a sphere."}, {"k": "colour", "t": "Colour", "def": "The hues we see. Colours can be mixed, matched or contrasted to create mood.", "words": ["primary", "secondary", "complementary", "warm", "cool", "saturated", "muted", "harmonious"], "try": "Paint the same object once in warm colours and once in cool colours. How does the mood change?"}, {"k": "shape", "t": "Shape", "def": "A flat, 2D area with an outline. Shapes can be geometric or organic.", "words": ["geometric", "organic", "flat", "silhouette", "outline", "positive", "negative"], "try": "Draw the negative space (the gaps) around a chair instead of the chair itself."}, {"k": "form", "t": "Form", "def": "A 3D shape, or the illusion of 3D on a flat surface using tone.", "words": ["3D", "volume", "solid", "sculpture", "cube", "sphere", "cylinder"], "try": "Shade a circle so it becomes a sphere, with a highlight and a cast shadow."}, {"k": "texture", "t": "Texture", "def": "How something feels or looks like it would feel. It can be real (actual) or drawn (visual).", "words": ["rough", "smooth", "bumpy", "jagged", "soft", "impasto", "rubbing"], "try": "Take rubbings of five surfaces around school and draw them in pencil."}, {"k": "pattern", "t": "Pattern", "def": "A design made by repeating lines, shapes or colours.", "words": ["repeat", "regular", "irregular", "symmetrical", "motif", "rotate"], "try": "Design a motif and repeat it in a grid, then rotate it to make a new pattern."}, {"k": "composition", "t": "Composition", "def": "How everything is arranged in the artwork: where the eye goes first and how it travels.", "words": ["focal point", "foreground", "background", "balance", "rule of thirds", "cropping", "layout"], "try": "Crop one photo three different ways with paper L-shapes and choose the strongest."}], "ks3": {"facts": [["Practical", "You make a final outcome (a finished piece)"], ["Written", "A reflection and evaluation of your work"], ["January", "In the assessment fortnight"]], "note": "Your Art assessment is practical, not a written exam. You produce a final piece of art, then write a reflection and evaluation of it. Your teacher will tell you which project and artist it is based on.", "what": [["The final outcome", "Your finished piece, which brings together the skills, artist and ideas from your project."], ["The reflection and evaluation", "Writing about what you made, how you made it, how the artist influenced you, what went well and what you would improve."]], "prepare": ["Look back through your sketchbook: is every task finished and labelled?", "Learn your artist: who they are, what their work looks like and how they made it (Artists tab).", "Learn the formal elements and use the words when you talk about art (Formal elements tab).", "Practise the techniques from your project at home: drawing, shading, colour.", "Practise your reflection with the Reflection writer tab."], "top": ["Look closely at your source: draw what you see, not what you think you see.", "Show clear links to your artist: their colours, marks, shapes or ideas.", "Take your time and take care: neat edges, full colour, no gaps.", "In your reflection, use art words: line, tone, colour, texture, composition.", "Always say <b>why<\/b>: \"I used warm colours <b>because<\/b>…\""]}, "reflect": [["What I made", ["For my final outcome I made…", "My piece shows…", "I chose this subject because…"]], ["How I made it", ["I used materials such as…", "First I…, then I…, finally I…", "The technique I used was…"]], ["Artist link", ["My work was inspired by…", "Like the artist, I used…", "You can see the link to the artist in…"]], ["Formal elements", ["I used line to…", "I used tone to show…", "The colours I chose were… because…", "The texture/pattern in my work…"]], ["What went well", ["I am pleased with… because…", "The most successful part is… because…"]], ["Even better if", ["To improve, I would…", "Next time I would… so that…"]]], "course": {"facts": [["60%", "Component 1: Portfolio (120 marks)"], ["40%", "Component 2: Externally Set Assignment (80 marks)"], ["4 AOs", "Each worth 25% of your grade"]], "comp": [["Component 1: Portfolio", "60% · 120 marks", "Your coursework projects from Year 10 and Year 11. No time limit. Marked by your teachers and checked (moderated) by Eduqas."], ["Component 2: Externally Set Assignment (ESA)", "40% · 80 marks", "Eduqas releases the paper in January of Year 11. You choose one starting point, do preparatory work, then make your final piece in a 10-hour supervised exam. Marked by your teachers and moderated by Eduqas."]], "title": "Your course is <b>Art, Craft and Design<\/b>. It is a broad title: you can work in drawing, painting, printmaking, photography, sculpture, textiles, collage and more. You must work in more than one area.", "band": [["Band 5", "25–30", "Sophisticated, thorough, highly personal"], ["Band 4", "19–24", "Confident, well developed"], ["Band 3", "13–18", "Consistent, some development"], ["Band 2", "7–12", "Some ability, basic"], ["Band 1", "1–6", "Limited"]]}, "aos": [{"n": "AO1", "t": "Develop", "e": "🔍", "spec": "Develop ideas through investigations, demonstrating critical understanding of sources.", "plain": "Research artists and other sources, understand them, and use what you learn to develop your own ideas.", "evidence": ["Artist research pages with your own analysis, not copied text", "Studies (copies) of artists' work in your own hand", "Clear links from each artist to your own ideas", "Mind maps and ideas that grow and change"], "check": ["I have researched at least one artist for each stage of my project", "I have explained what I like about each artist and why", "I have shown how each artist changed my own work"], "top": "Sustained, focused investigations and perceptive, rigorous critical analysis of sources."}, {"n": "AO2", "t": "Refine", "e": "🧪", "spec": "Refine work by exploring ideas, selecting and experimenting with appropriate media, materials, techniques and processes.", "plain": "Experiment with lots of materials and techniques, choose the best ones, and keep improving your work.", "evidence": ["Experiments in different media: paint, pastel, print, collage, photography, 3D", "Annotation that says what worked and what did not", "Developments that try the same idea in new ways", "Clear improvement from early to later work"], "check": ["I have tried at least four different media", "I have annotated every experiment", "I can show how I chose and refined my best ideas"], "top": "Rigorous selection and purposeful, creative experimentation, with media skilfully controlled and imaginatively exploited."}, {"n": "AO3", "t": "Record", "e": "✏️", "spec": "Record ideas, observations and insights relevant to intentions as work progresses.", "plain": "Record what you see and think: observational drawing, your own photographs and written notes, all the way through.", "evidence": ["Observational drawings from real objects and places", "Your own photographs, not images from the internet", "Annotation that explains your thinking", "Reflection on progress as you go"], "check": ["I have drawn from real life, not just from photos", "I have taken my own photographs", "My annotation explains my intentions"], "top": "Sophisticated recording through extensive, coherent research, with perceptive, rigorous reflection as work progresses."}, {"n": "AO4", "t": "Present", "e": "🖼️", "spec": "Present a personal and meaningful response that realises intentions and demonstrates understanding of visual language.", "plain": "Make a final piece that is personal to you, does what you planned, and clearly connects to your journey.", "evidence": ["A final outcome that is personal and well made", "Clear links back to your artists, experiments and recording", "A plan or design for the final piece", "A written evaluation of the outcome"], "check": ["My final piece connects to everything before it", "My final piece is personal, not a copy", "I have evaluated my final piece"], "top": "A highly imaginative, personal and meaningful response that realises intentions in a sophisticated, coherent and assured manner."}], "annot": [{"k": "artist", "t": "Analysing an artist", "ao": "AO1", "starters": ["This artwork is by… and was made in…", "The artist uses line/tone/colour to…", "The mood of the work is… because…", "The materials and technique used are…", "I think the artist is trying to show…", "I like/dislike… because…", "This links to my project because…", "I will use… from this artist in my own work by…"]}, {"k": "experiment", "t": "Experimenting with media", "ao": "AO2", "starters": ["In this experiment I used…", "I chose this material because…", "This worked well because…", "This was less successful because…", "If I tried this again I would…", "Compared with my last experiment, this…", "I will develop this further by…"]}, {"k": "record", "t": "Drawing and photography", "ao": "AO3", "starters": ["I drew/photographed this from observation because…", "I focused on… (light, texture, detail)", "I chose this angle/viewpoint because…", "This photo shows fragmentation/identity through…", "This recording helps my project because…"]}, {"k": "final", "t": "Planning and evaluating the final piece", "ao": "AO4", "starters": ["My final piece will show…", "It links to my artists… because…", "I have chosen the materials… because…", "My final piece is personal because…", "The most successful part is… because…", "If I had more time I would…"]}], "p10": {"title": "Fragments", "intro": "Your Year 10 project explores what the word <b>fragments<\/b> means to you, and how you can find fragmentation in your own local environment.", "steps": [["Think", "What does \"fragments\" mean to you? A broken object, a memory, a piece of a building, part of a face, a torn poster? Make a mind map."], ["Photograph", "Photograph fragmented objects and details around you. Look closely: get near, crop tightly, try unusual angles."], ["Draw", "Make observational drawings from your own photographs and from real objects."], ["Research", "Study Monika Sosnowska and how she transforms fragments of buildings."], ["Experiment", "Try different styles, materials and techniques: tone, collage, print, wire, card, clay, mixed media."], ["Develop", "Choose your strongest ideas and push them further, annotating as you go."], ["Present", "Plan and make a personal final outcome that brings your journey together."]], "where": ["Cracked pavements and kerbs", "Peeling posters and torn layers of paper", "Rusty railings, gates and fences", "Scaffolding and construction hoardings", "Broken tiles and brickwork", "Crumpled cans, packaging and fabric", "Reflections broken up in windows and puddles"], "safe": "Stay safe when you take photos: do not go onto building sites, do not touch broken glass or sharp metal, and take photos with a friend or adult."}, "p11": {"title": "Identity and portraiture", "intro": "Your Year 11 portfolio project explores <b>identity<\/b> through <b>portraiture<\/b>: how a face, marks, colour and materials can say who someone is.", "steps": [["Record", "Take your own portrait photographs: different lighting, angles and expressions. Draw from them and from a mirror."], ["Research", "Study Mike Parr, Francis Bacon, Henrietta Harris and REWA. Compare how each one shows identity."], ["Experiment", "Try each artist's techniques: layered and scratched marks, smearing, realistic studies then distortion, segmented colour and pattern."], ["Develop", "Combine ideas: for example a realistic face (Harris) divided into segments (REWA), or a drypoint (Parr) with smeared colour (Bacon)."], ["Present", "Plan and make a personal, meaningful final piece about your own identity."]], "compare": [["Mike Parr", "Scratched, repeated, scrubbed-out drypoint", "Identity is unstable and never finished"], ["Francis Bacon", "Smeared, twisted paint and flat backgrounds", "Raw feeling and inner tension"], ["Henrietta Harris", "Realistic then distorted with one swipe or swirl", "What a face hides as well as shows"], ["REWA", "Face split into bright patterned segments", "Heritage and the many layers of the self"]]}, "esa": {"facts": [["January 2027", "Eduqas releases the ESA paper"], ["Preparatory period", "Research, record, experiment, plan"], ["10 hours", "Supervised exam in the spring term"]], "steps": [["Read the paper", "The paper has 15 starting points: 5 themes, 5 visual stimuli and 5 written briefs. Read them all."], ["Choose your starting point", "Pick the one that excites you and gives you the most ideas. Make a quick mind map for your top three before you choose."], ["Find artists", "Find two or three artists who link to your starting point. Ask your teacher for suggestions."], ["Record", "Take your own photos and make observational drawings linked to your starting point."], ["Experiment and develop", "Try materials and techniques, annotate, and refine your ideas."], ["Plan your final piece", "Plan it in detail: size, materials, composition, and what you will do in each hour. Practise any difficult parts."], ["The 10-hour exam", "Make your final piece under supervised conditions. Bring your preparatory work to guide you."]], "tips": ["Use your preparatory time well: every session counts.", "Cover all four AOs in your preparatory work, just like your portfolio.", "Practise the hardest part of your final piece before the exam.", "Make a timed plan for the 10 hours and stick to it.", "Your final piece must clearly grow out of your preparatory work."]}, "gloss3": [["Formal elements", "Line", "A mark joining two points: thick, thin, curved or straight.", "line"], ["Formal elements", "Tone", "How light or dark something is.", "tone"], ["Formal elements", "Colour", "The hues we see and mix.", "colourwheel"], ["Formal elements", "Shape", "A flat, 2D area with an outline.", "shape"], ["Formal elements", "Form", "A 3D shape, or the illusion of 3D.", "form"], ["Formal elements", "Texture", "How something feels, or looks like it feels.", "texture"], ["Formal elements", "Pattern", "A repeated line, shape or colour.", "pattern"], ["Formal elements", "Composition", "How everything is arranged in the artwork.", "composition"], ["Colour", "Primary colours", "Red, yellow and blue: they cannot be mixed from other colours.", "primary"], ["Colour", "Secondary colours", "Orange, green and purple: made by mixing two primaries.", "secondary"], ["Colour", "Complementary colours", "Colours opposite each other on the colour wheel, such as blue and orange.", "complementary"], ["Colour", "Warm colours", "Reds, oranges and yellows: they feel hot or energetic.", "warm"], ["Colour", "Cool colours", "Blues, greens and purples: they feel calm or cold.", "cool"], ["Drawing", "Observational drawing", "Drawing from looking at a real object or place.", "eye"], ["Drawing", "Highlight", "The lightest part, where light hits an object.", "highlight"], ["Drawing", "Shadow", "The darker area where light is blocked.", "shadow"], ["Drawing", "Hatching", "Shading with parallel lines. Cross-hatching crosses them.", "hatching"], ["Drawing", "Blending", "Smoothly changing from one tone or colour to another.", "blend"], ["Drawing", "Mark making", "The different lines, dots and textures an artist makes.", "marks"], ["Drawing", "Proportion", "The size of parts compared with each other.", "proportion"], ["Artists and styles", "Still life", "Art of objects that do not move, such as fruit or vases.", "stilllife"], ["Artists and styles", "Portrait", "Art showing a person, usually their face.", "portrait"], ["Artists and styles", "Self-portrait", "A portrait of the artist by the artist.", "selfportrait"], ["Artists and styles", "Pop Art", "1960s art about adverts, celebrities and things people buy.", "popart"], ["Artists and styles", "Cubism", "Art that breaks objects into shapes seen from several viewpoints.", "cubism"], ["Artists and styles", "Impasto", "Paint put on so thickly that it stands up from the surface.", "brushmarks"], ["Artists and styles", "Screen print", "A print made by pushing ink through a mesh screen.", "screenprint"], ["Artists and styles", "Collage", "Art made by sticking pieces of paper or materials onto a surface.", "collage"], ["Your work", "Sketchbook", "Where you record, research and experiment.", "sketchbook"], ["Your work", "Final outcome", "Your finished piece at the end of a project.", "frame"], ["Your work", "Annotation", "Notes that explain your work and your thinking.", "annotate"], ["Your work", "Evaluation", "Judging your work: what went well and how to improve it.", "evaluate"]], "gloss4": [["Assessment", "Portfolio", "Component 1: your coursework, 60% of the GCSE.", "sketchbook"], ["Assessment", "Externally Set Assignment", "Component 2: the paper Eduqas sets in January, 40% of the GCSE.", "paper"], ["Assessment", "Starting point", "The theme, visual stimulus or brief you choose from the ESA paper.", "target"], ["Assessment", "Sustained focus", "The 10-hour supervised exam where you make your ESA final piece.", "clock"], ["Assessment", "Assessment objective", "One of the four skills you are marked on: develop, refine, record, present.", "checklist"], ["Assessment", "Moderation", "When the exam board checks your teachers' marking.", "evaluate"], ["Assessment", "Intentions", "What you plan and want your work to achieve.", "target"], ["Process", "Contextual source", "An artist, designer, place or culture that influences your work.", "gallery"], ["Process", "Critical understanding", "Analysing and explaining artwork, not just describing it.", "eye"], ["Process", "Refine", "To improve your work through selecting and experimenting.", "refine"], ["Process", "Experimentation", "Trying out media, materials and techniques.", "experiment"], ["Process", "Media", "The materials an artist uses, such as paint, charcoal or ink.", "palette"], ["Process", "Maquette", "A small model made to plan a sculpture.", "maquette"], ["Process", "Development", "How your ideas grow and change through a project.", "develop"], ["Process", "Annotation", "Notes that explain your work and your thinking.", "annotate"], ["Process", "Mind map", "A diagram to explore ideas around a word or theme.", "mindmap"], ["Process", "Composition", "How everything is arranged in the artwork.", "composition"], ["Process", "Focal point", "The part of an artwork that draws the eye first.", "focal"], ["Techniques", "Drypoint", "A print made by scratching lines into a plate, then inking it.", "etching"], ["Techniques", "Etching", "A print made from lines cut or scratched into a metal plate.", "etching"], ["Techniques", "Printmaking", "Making images that can be printed more than once.", "screenprint"], ["Techniques", "Impasto", "Paint put on so thickly that it stands up from the surface.", "brushmarks"], ["Techniques", "Gouache", "A thick, opaque watercolour paint.", "palette"], ["Techniques", "Mixed media", "Using more than one material in one artwork.", "collage"], ["Techniques", "Sculpture", "A 3D artwork.", "form"], ["Techniques", "Installation", "A large artwork built into a space that you can walk around.", "installation"], ["Techniques", "Site-specific", "Made for one particular place.", "installation"], ["Ideas", "Identity", "Who a person is: personality, heritage, memories, beliefs.", "portrait"], ["Ideas", "Heritage", "The culture and traditions passed down to you.", "heritage"], ["Ideas", "Distortion", "Twisting or changing a shape so it is no longer accurate.", "smear"], ["Ideas", "Fragment", "A small broken part of something bigger.", "fragment"], ["Ideas", "Fragmentation", "Breaking something into pieces.", "fragment"], ["Ideas", "Abstract", "Art that does not try to show things realistically.", "abstract"], ["Ideas", "Figurative", "Art that shows real people, animals or objects.", "portrait"], ["Ideas", "Realism", "Showing things as accurately as possible.", "eye"], ["Ideas", "Architecture", "The design of buildings.", "building"], ["Ideas", "Juxtaposition", "Placing two contrasting things side by side.", "juxta"], ["Formal elements", "Tone", "How light or dark something is.", "tone"], ["Formal elements", "Texture", "How something feels, or looks like it feels.", "texture"], ["Formal elements", "Complementary colours", "Colours opposite each other on the colour wheel.", "complementary"], ["Formal elements", "Contrast", "A strong difference: light and dark, rough and smooth.", "contrast"], ["Formal elements", "Line", "A mark joining two points.", "line"], ["Formal elements", "Form", "A 3D shape, or the illusion of 3D.", "form"]], "quiz3": [["What are the three primary colours?", "Red, yellow and blue", ["Red, green and blue", "Orange, green and purple", "Black, white and grey"], "They cannot be mixed from other colours."], ["Which two colours mix to make green?", "Blue and yellow", ["Red and blue", "Red and yellow", "Blue and white"], "Green is a secondary colour."], ["Which pair are complementary colours?", "Blue and orange", ["Red and pink", "Blue and green", "Yellow and orange"], "They sit opposite each other on the colour wheel."], ["Which formal element is about how light or dark something is?", "Tone", ["Texture", "Pattern", "Line"], "Tone makes things look 3D."], ["Which formal element is about how something feels?", "Texture", ["Tone", "Shape", "Colour"], "Texture can be real or drawn."], ["What is the difference between shape and form?", "Shape is flat (2D), form is 3D", ["They mean the same thing", "Shape is 3D, form is flat", "Form is only about colour"], "A square is a shape; a cube is a form."], ["Shading with lines that cross each other is called…", "Cross-hatching", ["Blending", "Stippling", "Collage"], "Hatching uses parallel lines; cross-hatching crosses them."], ["Which of these is a warm colour?", "Orange", ["Blue", "Green", "Purple"], "Reds, oranges and yellows are warm."], ["What is a still life?", "Art of objects that do not move", ["A portrait of a person", "A landscape at night", "A sculpture of an animal"], "Fruit, bottles and flowers are typical subjects."], ["Which art movement was Andy Warhol part of?", "Pop Art", ["Cubism", "Impressionism", "Surrealism"], "Pop Art was about adverts, celebrities and products."], ["How did Andy Warhol repeat the same image many times?", "Screen printing", ["Oil painting", "Clay modelling", "Photography only"], "The screen lets you print the same image again and again."], ["Which art movement did Picasso create with Georges Braque?", "Cubism", ["Pop Art", "Post-Impressionism", "Realism"], "Cubism breaks objects into geometric shapes."], ["In Cubism, objects are shown…", "From several viewpoints at the same time", ["Exactly as a photo shows them", "Only in black and white", "Without any shapes"], "A face might be seen from the front and side at once."], ["Van Gogh's thick paint, which stands up from the canvas, is called…", "Impasto", ["Watercolour", "Collage", "Hatching"], "Impasto gives texture."], ["Which famous painting is by Van Gogh?", "Sunflowers", ["Weeping Woman", "Marilyn Diptych", "Guernica"], "One version is at the National Gallery in London."], ["What does Hilary Pecis mostly paint?", "Everyday interiors and still lifes", ["Screaming portraits", "Abstract black squares", "Giant steel sculptures"], "Tables, shelves, plants and books."], ["Hilary Pecis's paintings use…", "Bright, flat colour and lots of pattern", ["Only grey and black", "Thick swirling impasto", "Smeared, blurred faces"], "Saturated colour and pattern fill her work."], ["What is annotation?", "Notes that explain your work and thinking", ["A type of paint", "A frame for a picture", "A shading technique"], "Annotation shows your understanding."], ["What is the focal point of an artwork?", "The part that draws your eye first", ["The frame", "The signature", "The back of the canvas"], "Artists use contrast and composition to create it."], ["In an evaluation, what should you always add?", "Why: the reason for your choices", ["Only the title", "The price", "Nothing: just list colours"], "Say \"because…\" to explain your choices."]], "quiz4": [["How much of the GCSE is Component 1, the portfolio?", "60%", ["40%", "50%", "25%"], "Component 1 is 60% (120 marks)."], ["How much of the GCSE is the Externally Set Assignment?", "40%", ["60%", "30%", "25%"], "Component 2 is 40% (80 marks)."], ["How long is the supervised ESA exam?", "10 hours", ["2 hours", "5 hours", "20 hours"], "It is the period of sustained focus."], ["When does Eduqas release the ESA paper?", "In January of Year 11", ["In September of Year 10", "In June of Year 11", "At the start of the exam"], "No earlier than 2 January."], ["How many starting points are on the ESA paper?", "15", ["5", "3", "10"], "5 themes, 5 visual stimuli and 5 written briefs."], ["Which assessment objective is about researching artists and developing ideas?", "AO1", ["AO2", "AO3", "AO4"], "AO1: Develop."], ["Which assessment objective is about experimenting with media?", "AO2", ["AO1", "AO3", "AO4"], "AO2: Refine."], ["Which assessment objective is about observational drawing and photography?", "AO3", ["AO1", "AO2", "AO4"], "AO3: Record."], ["Which assessment objective is about the final piece?", "AO4", ["AO1", "AO2", "AO3"], "AO4: Present."], ["How much is each assessment objective worth?", "25%", ["10%", "40%", "60%"], "All four are equally weighted."], ["What is a maquette?", "A small model used to plan a sculpture", ["A type of print", "A shading technique", "A kind of paintbrush"], "Monika Sosnowska makes maquettes in wire, card and paper."], ["Which materials does Monika Sosnowska mostly use?", "Steel, rebar and concrete", ["Watercolour and gouache", "Silkscreen ink", "Oil pastels"], "Construction materials from buildings."], ["Sosnowska's work comes from the architecture of…", "Communist and post-communist Poland", ["Ancient Egypt", "Victorian London", "Renaissance Italy"], "Her fragments of stairs, gates and handrails come from that history."], ["Where was Sosnowska's exhibition Weight of Matter shown in autumn 2026?", "The South London Gallery on Peckham Road", ["Tate Modern", "The National Gallery", "The British Museum"], "Just down the road from HAP."], ["Mike Parr made many large self-portraits using…", "Drypoint etching", ["Screen printing", "Clay", "Photography only"], "Lines scratched into a plate, then printed."], ["Francis Bacon's portraits are best known for being…", "Distorted and smeared", ["Tiny and perfectly realistic", "Made from steel", "Covered in pattern segments"], "He twisted and smeared the paint."], ["Francis Bacon's screaming popes were based on a portrait by…", "Velázquez", ["Picasso", "Warhol", "Van Gogh"], "A 1650 portrait of Pope Innocent X."], ["How does Henrietta Harris change her realistic portraits?", "She distorts them with swirls, smudges or one swipe of paint", ["She prints them many times", "She builds them in concrete", "She cuts them into cubes"], "Realism then distortion."], ["Which materials does Henrietta Harris often use?", "Watercolour and gouache", ["Rebar and concrete", "Silkscreen", "Charcoal only"], "She also paints in oil."], ["In REWA's portraits, the face is…", "Divided into colourful, patterned segments", ["Scrubbed out", "Smeared with a dry brush", "Left completely blank"], "Like stained glass or a mosaic."], ["REWA's work celebrates…", "Igbo heritage in Nigeria", ["Pop culture in America", "Polish architecture", "Australian landscapes"], "She calls it Igbo Vernacular Art."], ["A \"fragment\" is…", "A small broken part of something bigger", ["A finished painting", "A type of paint", "A whole building"], "The theme of the Year 10 project."], ["Which is the best evidence for AO3?", "Your own photos and observational drawings", ["Text copied from a website", "A printed internet image", "A blank page"], "AO3 is about recording from first-hand sources."], ["Good annotation should…", "Explain your choices and how your work will develop", ["Repeat the artist's life story", "Describe only the colours", "Be copied from the internet"], "Critical understanding, not just description."], ["What is site-specific art?", "Art made for one particular place", ["Art that can go anywhere", "Art made on a computer", "A small drawing in a sketchbook"], "Sosnowska makes site-specific installations."]], "videos": {}, "icons": {"mindmap": "<circle cx=\"50\" cy=\"50\" r=\"14\" fill=\"#F4B740\" stroke=\"#1B2A3A\" stroke-width=\"4\"/><line x1=\"50\" y1=\"50\" x2=\"16\" y2=\"18\" stroke=\"#1B2A3A\" stroke-width=\"3\" stroke-linecap=\"round\"/><circle cx=\"16\" cy=\"18\" r=\"9\" fill=\"#fff\" stroke=\"#1B2A3A\" stroke-width=\"3\"/><line x1=\"50\" y1=\"50\" x2=\"84\" y2=\"18\" stroke=\"#1B2A3A\" stroke-width=\"3\" stroke-linecap=\"round\"/><circle cx=\"84\" cy=\"18\" r=\"9\" fill=\"#fff\" stroke=\"#1B2A3A\" stroke-width=\"3\"/><line x1=\"50\" y1=\"50\" x2=\"14\" y2=\"82\" stroke=\"#1B2A3A\" stroke-width=\"3\" stroke-linecap=\"round\"/><circle cx=\"14\" cy=\"82\" r=\"9\" fill=\"#fff\" stroke=\"#1B2A3A\" stroke-width=\"3\"/><line x1=\"50\" y1=\"50\" x2=\"86\" y2=\"82\" stroke=\"#1B2A3A\" stroke-width=\"3\" stroke-linecap=\"round\"/><circle cx=\"86\" cy=\"82\" r=\"9\" fill=\"#fff\" stroke=\"#1B2A3A\" stroke-width=\"3\"/><line x1=\"50\" y1=\"50\" x2=\"50\" y2=\"8\" stroke=\"#1B2A3A\" stroke-width=\"3\" stroke-linecap=\"round\"/><circle cx=\"50\" cy=\"8\" r=\"9\" fill=\"#fff\" stroke=\"#1B2A3A\" stroke-width=\"3\"/><line x1=\"50\" y1=\"50\" x2=\"50\" y2=\"92\" stroke=\"#1B2A3A\" stroke-width=\"3\" stroke-linecap=\"round\"/><circle cx=\"50\" cy=\"92\" r=\"9\" fill=\"#fff\" stroke=\"#1B2A3A\" stroke-width=\"3\"/>", "focal": "<rect x=\"8\" y=\"12\" width=\"84\" height=\"76\" rx=\"0\" fill=\"#DDEAF5\" stroke=\"#1B2A3A\" stroke-width=\"4\"/><line x1=\"8\" y1=\"12\" x2=\"50\" y2=\"50\" stroke=\"#9CC7E8\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"14\" y1=\"12\" x2=\"50\" y2=\"50\" stroke=\"#9CC7E8\" stroke-width=\"2\" st
